name: Castlie
options:
  bundleIdPrefix: com.castlie
  deploymentTarget:
    iOS: "26.1"
  developmentLanguage: uk
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MAC_DESIGNED_FOR_IPAD: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UIBackgroundModes: "audio"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    GENERATE_INFOPLIST_FILE: "YES"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: RCB9V8KY57
    CODE_SIGN_IDENTITY: "iPhone Developer"

targets:
  Castlie:
    type: application
    platform: iOS
    sources:
      - path: Castlie
        excludes:
          - "**/.DS_Store"
    info:
      path: Castlie/Info.plist
      properties:
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.castlie.app
        DEVELOPMENT_TEAM: RCB9V8KY57
        PRODUCT_NAME: Castlie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Castlie

schemes:
  Castlie:
    build:
      targets:
        Castlie: all
    run:
      config: Debug
